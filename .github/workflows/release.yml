name: release

on:
  push:
    tags:
      - 'v*'

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

jobs:
  release:
    concurrency:
      group: release
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@latest

      - name: 🚧 Build (stub)
        run: pnpm dev:prepare

      - name: 🛠 Build project
        run: pnpm build

      - name: 🏷️ Extract tag name
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

          # Extract pre-release tag (alpha, beta, rc, etc.)
          if [[ $TAG =~ -([a-zA-Z]+) ]]; then
            DIST_TAG="${BASH_REMATCH[1]}"
            echo "dist_tag=$DIST_TAG" >> $GITHUB_OUTPUT
            echo "Publishing as pre-release with tag: $DIST_TAG"
          else
            echo "dist_tag=latest" >> $GITHUB_OUTPUT
            echo "Publishing as stable release (latest)"
          fi

      - name: 📦 Release
        run: pnpm publish --no-git-checks --tag ${{ steps.tag.outputs.dist_tag }}
